<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayakarta Roleplay | Official Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Menggunakan Font Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- Header dengan Glassmorphism -->
    <header class="glass-header">
        <div class="brand">
            <img src="https://tareqwavlgqoexxffuuc.supabase.co/storage/v1/object/sign/Logo_Website/Logo_Website/file_00000000a8287207b6664fa6ffeb10b4.png" alt="Logo">
            <span>JAYAKARTA RP</span>
        </div>
        <button id="menu-btn"><i class="fa fa-bars"></i></button>
    </header>

    <!-- Navigasi Tersembunyi -->
    <nav id="navbar" class="hidden">
        <ul>
            <li onclick="loadPage('profile')">Profile Community</li>
            <li onclick="loadPage('pejabat')">Profile Pejabat Negara</li>
            <li onclick="loadPage('sejarah')">Sejarah Community</li>
            <li onclick="loadPage('images')">Images Public</li>
            <li onclick="loadPage('media')">Media Information</li>
            <li onclick="loadPage('admin')">Administrator</li>
            <li onclick="loadPage('settings')">Settings</li>
        </ul>
    </nav>

    <!-- Content Utama -->
    <main id="app-container">
        <div id="content" class="glass-card">
            <h1 class="glitch-text">JAYAKARTA ROLEPLAY</h1>
            <p class="subtitle">PREMIUM INDONESIAN ROLEPLAY EXPERIENCE</p>
            
            <div class="btn-group">
                <button class="btn-glow" id="btn-join">JOIN DISCORD</button>
            </div>

            <!-- Piringan Hitam (Vinyl) -->
            <div id="vinyl" class="vinyl-record">
                <div class="inner-circle"></div>
            </div>
        </div>
    </main>

    <!-- Service Worker & Scripts -->
    <script type="module" src="script.js"></script>
    <script>
        // Registrasi Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
